name: Проверка и публикация игры

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Проверки и сборка в Docker
    # Зафиксированные Docker-образы совпадают с локальной сборкой на ARM64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: plukh-pages-${{ github.run_id }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Проверить типы, правила и игру в браузере
        run: ./scripts/check.sh all
      - name: Извлечь проверенную сборку
        run: |
          mkdir -p "$RUNNER_TEMP/plukh-pages"
          docker compose cp game:/usr/share/nginx/html/play/plukh/. "$RUNNER_TEMP/plukh-pages/"
          test -s "$RUNNER_TEMP/plukh-pages/index.html"
      - name: Передать сборку в Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/plukh-pages
      - name: Удалить контейнеры проверки
        if: always()
        run: docker compose --profile checks down --remove-orphans

  deploy:
    name: Опубликовать на GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Проверить настройки Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Опубликовать игру
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
